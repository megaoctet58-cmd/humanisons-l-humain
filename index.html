<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Humanisons l'humain — Un réseau humain plutôt qu'un réseau social." />
    <meta name="theme-color" content="#1C1C1C" />
    <title>Humanisons l'humain</title>
    <script>
      // Applique le thème mémorisé avant le premier rendu (évite le flash).
      try {
        var t = localStorage.getItem('hlh.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
